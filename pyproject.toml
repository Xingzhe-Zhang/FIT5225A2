[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pacific-bioarchive"
version = "0.1.0"
description = "Local-first multi-cloud serverless wildlife media platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "Pillow>=10,<13",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyJWT[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "boto3>=1.40,<2",
  "azure-cosmos>=4.9,<5",
  "jsonschema>=4.23,<5",
  "python-hcl2>=7,<8",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "PyYAML>=6,<7",
]
ml = [
  "megadetector==5.0.4",
  "numpy>=1.26,<3",
  "onnx==1.16.2",
  "onnx2torch>=1.5,<2",
  "setuptools>=75,<81",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"

[tool.setuptools.packages.find]
include = ["backend*"]
